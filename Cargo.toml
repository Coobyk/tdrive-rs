[package]
name = "tdrive-rs"
version = "0.1.0"
edition = "2024"

[lib]
# The engine, with no user interface attached. The phone application in
# `Coobyk/tdrive-android` speaks to it over JNI.
name = "tdrive_rs"
path = "src/lib.rs"

[[bin]]
# The desktop shell, which draws with the engine.
name = "tdrive-rs"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
# The desktop shell's own dependencies: the renderer, the component library,
# the file dialog and the clipboard. The engine does not need any of them,
# which is what lets the same code build for a phone.
desktop = [
    "dep:arboard",
    "dep:gpui",
    "dep:gpui-component",
    "dep:gpui-kit-assets",
    "dep:gpui_platform",
    "dep:rfd",
    "dep:rusqlite",
]

[dependencies]
anyhow = "1"
arboard = { version = "3", optional = true }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
gpui = { package = "gpui-pre", version = "0.3.7", features = ["font-kit", "wayland", "x11"], optional = true }
gpui_platform = { package = "gpui-pre-platform", version = "0.3.7", features = ["font-kit", "x11", "wayland"], optional = true }
gpui-component = { version = "=0.7.0", optional = true }
gpui-kit-assets = { version = "=0.7.0", optional = true }
grammers-client = "0.10"
grammers-mtsender = "0.10"
grammers-session = "0.10"
libc = "=0.2.189"
rusqlite = { version = "0.32", features = ["bundled", "chrono"], optional = true }
rfd = { version = "0.15", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
argon2 = "0.6.0"
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
sha2 = "0.11.1"
base64 = "0.23.1"
zeroize = "1.9.1"
getrandom = "0.4.3"
grammers-tl-types = "0.10"
# A picture of a file is made here, so the gallery can keep a small one
# instead of the whole file it was made from.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
